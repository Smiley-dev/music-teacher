[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Optimize dependencies (FFT, audio) even in debug builds; our own crates stay
# fast to compile. Without this, DSP in `tauri dev` is ~10x slower.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.dsp]
opt-level = 2

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
